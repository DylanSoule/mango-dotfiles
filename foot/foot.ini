# Foot Terminal Configuration - Optimized Tokyo Night Theme & Modern Settings

[main]
# Modern typography with fallbacks
font=JetBrainsMono Nerd Font:size=11.5:style=Regular

# Copy selected text to clipboard automatically
selection-target=clipboard

# Modern terminal behaviors
pad=6x6 center
resize-by-cells=no
box-drawings-uses-font-glyphs=yes

[cursor]
style=block
blink=yes
blink-rate=500

[colors-dark]
alpha=0.80
background=111318
foreground=edf2f7
cursor=111318 edf2f7

